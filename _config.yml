# Site settings
# Changes to this file are not picked up by `jekyll serve`, restart the server instead.
title: "Hype: The Time Quest Forever"
tagline: "Fan site for Hype: The Time Quest"   # title of the home page: "<title> | <tagline>"
description: >
  Fan site for the game Hype: The Time Quest, with cheats, downloads,
  music, photos, videos and the Hype Forever blog.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hypeforever.github.io" # the base hostname & protocol for your site
lang: en
locale: en_US   # og:locale (Facebook expects language_TERRITORY)
# Same time zone as the GitHub Pages build; archive dates carry no time zone
timezone: UTC

# Social media
facebook_group_name: hypeforever
facebook_group_id: 126929554163825

github_username: hypeforever

# Build settings
markdown: kramdown
sass:
  style: compressed

# Keep the URLs from the time the site lived under /blog
permalink: /blog/:year/:month/:day/:title:output_ext

feed:
  path: blog/feed.xml

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Read-only archive of the old forum "The Inn": one file per topic in _forum,
# one file per member with at least one post in _members (no member index page)
collections:
  forum:
    output: true
    permalink: /forum/topics/:name/
  members:
    output: true
    permalink: /forum/members/:name/
  # Photo albums: one file per album in _albums (named like the album folder in
  # assets/photos/, created by _tools/build_photos.py), data in _data/photos.yml
  albums:
    output: true
    permalink: /photos/:name/
  # Videos: one file per video in _videos (named like the video's slug, created
  # by _tools/build_videos.py), data in _data/videos.yml
  videos:
    output: true
    permalink: /videos/:name/

# Social media preview: jekyll-seo-tag uses a large image card by default.
# (No `twitter:` block here: it would output an empty twitter:site tag.)

defaults:
  # Preview image for social media (1200x630), used by every page without its own image
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/layout/og-image.jpg
        width: 1200
        height: 630
  - scope:
      type: albums
    values:
      layout: album
      seo:
        type: WebPage   # jekyll-seo-tag would mark collection pages as BlogPosting
  - scope:
      type: videos
    values:
      layout: video
      seo:
        type: WebPage
  - scope:
      type: forum
    values:
      layout: forum-topic
      heading: The Inn (Forum)
      seo:
        type: WebPage   # the detailed DiscussionForumPosting comes from the layout
  - scope:
      type: members
    values:
      layout: forum-member
      heading: The Inn (Forum)
      seo:
        type: WebPage   # the detailed ProfilePage comes from the layout
  - scope:
      path: forum
    values:
      heading: The Inn (Forum)
