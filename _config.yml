# Site settings
# Changes to this file are not picked up by `jekyll serve`, restart the server instead.
title: "Hype: The Time Quest Forever"
description: >
  Fan site for the game Hype: The Time Quest, with cheats, downloads,
  music, photos, videos and the Hype Forever blog.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hypeforever.github.io" # the base hostname & protocol for your site
lang: en

# Social media
facebook_group_name: hypeforever
facebook_group_id: 126929554163825

github_username: hypeforever

# Build settings
markdown: kramdown

# Keep the URLs from the time the site lived under /blog
permalink: /blog/:year/:month/:day/:title:output_ext

feed:
  path: blog/feed.xml

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Read-only archive of the old forum "The Inn": one file per topic in _forum,
# one file per member with at least one post in _members (no member index page)
collections:
  forum:
    output: true
    permalink: /forum/topics/:name/
  members:
    output: true
    permalink: /forum/members/:name/
  # Photo albums: one file per album in _albums (named like the album folder in
  # assets/photos/, created by _tools/build_photos.py), data in _data/photos.yml
  albums:
    output: true
    permalink: /photos/:name/
  # Videos: one file per video in _videos (named like the video's slug, created
  # by _tools/build_videos.py), data in _data/videos.yml
  # Pages are switched on (output: true) together with the video layout.
  videos:
    output: false
    permalink: /videos/:name/

defaults:
  - scope:
      type: albums
    values:
      layout: album
  - scope:
      type: forum
    values:
      layout: forum-topic
  - scope:
      type: members
    values:
      layout: forum-member
