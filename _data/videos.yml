  - slug: 19020886-big-oob-skip-in-field-of-courage-ii
    youtube_id: _zFi8tpMqmg
    title: Big OoB Skip in Field of Courage II
    description: |-
      One of door at the Field of Courage II is broken - you can make it think you passed it even though you really don't - it results in an easy way to t OoB which apparently has a deathwarp trigger.
      To perform it you have to stay at front of door with crossbow in hands , jump and spam shooting button when you are around to land.
      Saves ca. 35s in run, if done perfect.
    author: Darnok_PL
    author_id: 125245904
    posted: 2017-07-16 10:08
    available: true
    thumb: /assets/videos/thumbs/_zFi8tpMqmg.jpg
  - slug: 19020913-jewel-of-mankind-without-signed-pass
    youtube_id: WPwcXuxkzWM
    title: Jewel of Mankind without Signed Pass
    description: |-
      Finally I have found a way to enter Field of Courage II without Signed Pass, which enables me to get Jewel of Mankind at very beginning of Era II. You have to run towards the gate and jump short before opening it with spacebar - Hype overjumps the gate and falls down OoB.

      However, finishing the game requires collecting the Flag of Taskan II, which requires getting key to Monastery II - so you must do stuff from killing Rajoth to speaking with Hennaff (a brigand who tells you about hollow tree). But you can do it later, with running boots and better sword!
    author: Darnok_PL
    author_id: 125245904
    posted: 2017-07-16 14:12
    available: true
    thumb: /assets/videos/thumbs/WPwcXuxkzWM.jpg
  - slug: 19022109-en-any-speedrun-in-1-54-31-wr
    youtube_id: gaubSWRzqjA
    title: '[EN] Any% Speedrun in 1:54:31 (WR)'
    description: |-
      After 2 years I came back to this game, did some glitchhunt, found some cool timesavers, and the result is a new WR.
      This run was done in single segment, without cheats/hacks, only glitches.
