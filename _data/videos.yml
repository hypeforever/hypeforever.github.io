  - slug: 19004123-black-tower-iv-in-3-min-easter-egg
    youtube_id: 2PnMMmb3EjQ
    title: Black Tower IV in 3 min Easter Egg
    description: If you press some specific key combination in Gogoud's Manoir I, it causes many interesting levels. It allows you to enter Black Tower IV at the beginning. Because it's working Gogoud's Manoir I level only, it seems to be a cool easter egg rather than a cheat code. It was discovered by accident, by random messing around - that was ridiculously lucky to happen and it was also not easy to guess the key combination.
    author: Darnok_PL
    author_id: 125245904
    posted: 2017-02-05 05:17
    available: true
    thumb: /assets/videos/thumbs/2PnMMmb3EjQ.jpg
