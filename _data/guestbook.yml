- id: 42911667
  name: "Chuckchuk"
  date: 2016-10-02
  text: |-
    Now! My new question is! When are we all going to sit down and make: "Hype the Time Quest Remastered"?!

    I've been thinking right now, and as far as what should be done I've got a few thoughts already:

    1)
    So about the graphics, this is what I'm most tentative with. There are two options in my mind:
    First, keep the playmobil graphics but improve the sharpness of them, and some more lighting effects.
    Second, to make the game in an entirely different art style, but KEEP the awesome feel which is given from the playmobil graphics.

    Regardless of which, graphics would have to be updated

    2)
    I think that the gameplay should be even MORE than what was in the original, we could double the content even! Adding new spells, new quests, loads of lil' easter eggs, new zones, polishes in story and progression, and things of this manner, as well as keeping the comical mixed with serious aspects in the new features, which were a crucial part of the game game!
    Also, a few things could change, like the flying mechanics could be made better, and the sky zone could be made more interactive and fun, cause I remember it being more tedius than anything.

    Also, we could add more puzzles to existing zones, and this would be even easier to do if we actually remade all the graphics and zones alltogether.

    3)
    I remember this game was incredibly mindbogglingly difficult for me as a child, and when I played it again (it was still loads of fun), I regret to say that the difficulty only came from the control scheme (although I don't think I'd change the controls either, unless we introduce newer combat). But kicking up the difficulty, even by introducing them in new additions to the game, that would be fantastic.

    4)
    The only last thing I thought up for now would be to slightly remaster the soundtrack. This magnificent, or spectacular, soundtrack has always stayed in my memory and to have it slightly remastered in sound quality would be fantastic!
