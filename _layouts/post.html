---
layout: default
---
<article class="box post">

  <header class="box-header">
    <h1 class="box-title">{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • {{ page.author }}{% endif %}</p>
  </header>

  <div class="box-content">
    {{ content }}
  </div>

</article>
